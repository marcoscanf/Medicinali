<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner Medicinali</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#0f7b6c;--bd:#e3e6ea;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#e8eaed;--mut:#9aa3ad;--ac:#3fbfa8;--bd:#2c333b;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#e8eaed;--mut:#9aa3ad;--ac:#3fbfa8;--bd:#2c333b;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,input{font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.exp{white-space:nowrap}.late{color:var(--bad);font-weight:700}
video{width:100%;border-radius:12px;background:#000;max-height:50vh}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
label{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<h1>💊 Scanner medicinali</h1>

<div class="card" id="dbCard">
  <div id="dbStatus" class="mut"></div>
  <div class="row" style="margin:8px 0 0">
    <button class="sec" onclick="csvIn.click()">Importa elenco AIFA (CSV)</button>
    <input type="file" id="csvIn" accept=".csv,.txt" hidden>
  </div>
</div>

<div class="row">
  <button onclick="startScan()">📷 Scansiona</button>
  <button class="sec" onclick="openSheet({aic:'',name:'',active:'',exp:'',lot:''})">Inserisci a mano</button>
</div>

<div class="card" id="scanBox" hidden>
  <video id="vid" playsinline muted></video>
  <div class="mut" id="scanMsg" style="margin:8px 0">Inquadra il codice a barre o il DataMatrix…</div>
  <button class="sec" onclick="stopScan()">Chiudi fotocamera</button>
</div>

<div class="card wrap">
  <table>
    <thead><tr><th>Nome</th><th>Principio attivo</th><th>Scadenza</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="mut">Nessun medicinale ancora.</div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 style="margin:0 0 8px;font-size:18px">Dettagli medicinale</h2>
    <div id="notFound" class="mut" style="color:var(--bad);display:none">Codice non trovato nell'elenco: inserisci i dati a mano.</div>
    <label>Nome</label><input id="fName">
    <label>Principio attivo</label><input id="fAct">
    <label>Data di scadenza</label><input id="fExp" type="month">
    <div class="row"><button onclick="save()">Salva</button><button class="sec" onclick="closeSheet()">Annulla</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let items=[],cur=null,reader=null,meds=new Map(),D=null;
// ---- storage (IndexedDB per elenco AIFA, localStorage per la lista) ----
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('med',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}}
function loadItems(){try{items=JSON.parse(localStorage.getItem('items')||'[]')}catch(e){items=[]}}
function saveItems(){try{localStorage.setItem('items',JSON.stringify(items))}catch(e){}}
// ---- archivio online (db) con ripiego locale ----
async function initDb(){try{if(window.claude&&claude.use)D=await claude.use('db')}catch(e){D=null}}
async function storeMeds(rows){
  if(!D){await idbSet('meds',rows);return}
  const col=D.collection('meds');
  for(const d of (await col.get()).docs)await col.doc(d.id).delete();
  let buf=[],len=0,n=0;
  const flush=async()=>{if(!buf.length)return;await col.doc('c'+String(n++).padStart(3,'0')).set({r:buf.join('\n')});$('dbStatus').textContent='Salvataggio online… blocco '+n;buf=[];len=0};
  for(const r of rows){const t=r.map(x=>String(x).replace(/\s+/g,' ')).join('\t');if(len+t.length>150000)await flush();buf.push(t);len+=t.length+1}
  await flush();
}
async function loadMeds(){
  let rows=null;
  if(D){try{rows=[];(await D.collection('meds').get()).docs.forEach(d=>{const r=d.data().r;if(r)r.split('\n').forEach(l=>rows.push(l.split('\t')))})}catch(e){rows=null}}
  if(!rows||!rows.length)rows=await idbGet('meds');
  return new Map((rows||[]).map(x=>[x[0],x]));
}
// ---- CSV AIFA ----
function splitLine(l,d){const o=[];let c='',q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
function parseCsv(t){
  const lines=t.split(/\r?\n/).filter(Boolean);if(!lines.length)return[];
  const h=lines[0];const d=[';',',','|','\t'].sort((a,b)=>h.split(b).length-h.split(a).length)[0];
  const H=splitLine(h,d).map(x=>x.trim().toLowerCase());
  const ia=H.findIndex(x=>/aic/.test(x));
  let inm=H.findIndex(x=>/denominaz/.test(x));if(inm<0)inm=H.findIndex(x=>/nome|medicinale|confezione/.test(x));
  const ip=H.findIndex(x=>/principio|attivo/.test(x));
  if(ia<0||inm<0)return null;
  const out=[];
  for(let i=1;i<lines.length;i++){const c=splitLine(lines[i],d);const a=(c[ia]||'').replace(/\D/g,'');if(!a)continue;
    out.push([a.padStart(9,'0'),(c[inm]||'').trim(),ip>=0?(c[ip]||'').trim():''])}
  return out;
}
$('csvIn').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('dbStatus').textContent='Importazione in corso…';
  const rows=parseCsv(await f.text());
  if(!rows||!rows.length){$('dbStatus').textContent='CSV non riconosciuto: servono colonne con AIC e denominazione.';return}
  try{await storeMeds(rows);meds=new Map(rows.map(r=>[r[0],r]));dbStatus()}catch(e){$('dbStatus').textContent='Salvataggio non riuscito ('+(e.code||e.message)+'). Riprova.'}
};
function dbStatus(){$('dbStatus').textContent=meds.size?`Elenco AIFA caricato: ${meds.size.toLocaleString('it')} confezioni, ${D?'salvato online':'salvato solo su questo telefono'}.`:'Nessun elenco AIFA: importa il CSV open data per il riconoscimento automatico.'}
// ---- parsing codici ----
function parseGS1(t){
  t=t.replace(/[()]/g,'');const GS='\x1d';let i=0,o={};
  const fixed={'01':14,'17':6,'11':6,'15':6},vari=['10','21'];
  while(i<t.length){const ai=t.substr(i,2);i+=2;
    if(fixed[ai]){o[ai]=t.substr(i,fixed[ai]);i+=fixed[ai]}
    else if(vari.includes(ai)){let e=t.indexOf(GS,i);if(e<0)e=t.length;o[ai]=t.slice(i,e);i=e+1}
    else if(t[i-2]===GS)i-=1;else break}
  return o;
}
function decode(text){
  let aic='',exp='',lot='';
  const g=parseGS1(text);
  if(g['01']){const x=g['01'];aic=x.startsWith('080')?x.substr(3,9):x.slice(-10,-1);lot=g['10']||'';
    const e=g['17'];if(e&&e.length==6)exp=`20${e.substr(0,2)}-${e.substr(2,2)}`}
  else{const m=text.match(/^A?(\d{9})\d?$/i);aic=m?m[1]:text.replace(/\D/g,'').slice(0,9)}
  return{aic,exp,lot};
}
// ---- scanner ----
async function startScan(){
  $('scanBox').hidden=false;
  try{
    const H=new Map();H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.EAN_13]);
    reader=new ZXing.BrowserMultiFormatReader(H);
    await reader.decodeFromConstraints({video:{facingMode:'environment'}},$('vid'),(r)=>{
      if(r){const d=decode(r.getText());stopScan();if(navigator.vibrate)navigator.vibrate(80);
        const m=meds.get(d.aic);openSheet({aic:d.aic,name:m?m[1]:'',active:m?m[2]:'',exp:d.exp,lot:d.lot},!m)}
    });
  }catch(e){$('scanMsg').textContent='Fotocamera non disponibile: consenti l’accesso in Safari.'}
}
function stopScan(){try{reader&&reader.reset()}catch(e){}$('scanBox').hidden=true}
// ---- finestra e tabella ----
function openSheet(d,nf){cur=d;$('fName').value=d.name;$('fAct').value=d.active;$('fExp').value=d.exp;$('notFound').style.display=nf?'block':'none';$('modal').classList.add('on')}
function closeSheet(){$('modal').classList.remove('on')}
async function save(){
  if(!$('fName').value.trim()||!$('fExp').value){alert('Inserisci nome e data di scadenza.');return}
  const it={...cur,name:$('fName').value.trim(),active:$('fAct').value.trim(),exp:$('fExp').value,id:Date.now()};
  if(D){try{await D.collection('items').doc(String(it.id)).set(it)}catch(e){alert('Salvataggio online non riuscito ('+(e.code||e.message)+').');return}}
  else{items.push(it);saveItems();render()}
  closeSheet();
}
async function del(id){
  if(D){try{await D.collection('items').doc(String(id)).delete()}catch(e){alert('Eliminazione non riuscita.')}}
  else{items=items.filter(x=>x.id!==id);saveItems();render()}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  items.sort((a,b)=>a.exp.localeCompare(b.exp));
  const now=new Date().toISOString().slice(0,7);
  $('empty').hidden=items.length>0;
  $('rows').innerHTML=items.map(x=>{const [y,m]=x.exp.split('-');
    return`<tr><td>${esc(x.name)}</td><td>${esc(x.active)||'—'}</td><td class="exp ${x.exp<now?'late':''}">${m}/${y}</td><td><button class="sec" style="padding:4px 9px" onclick="del(${x.id})">✕</button></td></tr>`}).join('');
}
(async()=>{
  await initDb();
  if(D){items=[];render();D.collection('items').onSnapshot(sn=>{items=sn.docs.map(d=>d.data());render()},()=>{})}
  else{loadItems();render()}
  meds=await loadMeds();dbStatus();
})();
</script>
</body>
</html>
